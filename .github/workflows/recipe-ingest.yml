name: Recipe ingestion

on:
  workflow_dispatch:
    inputs:
      input_file:
        description: 'JSONL candidate file path'
        required: true
        default: 'recipe-candidates.jsonl'
      min_score:
        description: 'Minimum recipe quality score'
        required: true
        default: '0.82'

jobs:
  ingest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run quality-gated import
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RECIPE_INPUT: ${{ github.event.inputs.input_file }}
          RECIPE_MIN_SCORE: ${{ github.event.inputs.min_score }}
        run: node apps/backend/scripts/recipe-ingest.mjs
