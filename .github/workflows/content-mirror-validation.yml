name: Content Mirror Validation

on:
  push:
    paths:
      - 'apps/backend/scripts/content-mirror-run.mjs'
      - 'apps/backend/scripts/content-mirror-audit.mjs'
      - 'apps/backend/package.json'
      - '.github/workflows/content-mirror-validation.yml'
  pull_request:
    paths:
      - 'apps/backend/scripts/content-mirror-run.mjs'
      - 'apps/backend/scripts/content-mirror-audit.mjs'
      - 'apps/backend/package.json'
      - '.github/workflows/content-mirror-validation.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate JSON
        run: node -e "JSON.parse(require('fs').readFileSync('apps/backend/package.json','utf8')); console.log('package.json OK')"
      - name: Validate script syntax
        run: |
          node --check apps/backend/scripts/content-mirror-run.mjs
          node --check apps/backend/scripts/content-mirror-audit.mjs
      - name: Confirm sharp remains declared
        run: node -e "const p=require('./apps/backend/package.json'); if(!p.dependencies.sharp) process.exit(1); console.log('sharp dependency OK')"
