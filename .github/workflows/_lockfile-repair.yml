name: _lockfile repair helper

on:
  push:
    branches:
      - audit/final-verification-2026-09-12

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message != 'chore(audit): sync pnpm lockfile'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Regenerate lockfile in workspace
        run: pnpm install --no-frozen-lockfile --ignore-scripts
      - name: Commit generated lockfile only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo 'Lockfile already synchronized.'
            exit 0
          fi
          git diff --cached --stat
          git commit -m 'chore(audit): sync pnpm lockfile'
          git push origin HEAD:audit/final-verification-2026-09-12
