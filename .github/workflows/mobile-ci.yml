name: Mobile CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/mobile-ci.yml'

permissions:
  contents: read

jobs:
  mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck mobile
        run: pnpm --filter @my-personal-assistant/mobile typecheck

      - name: Validate Expo project
        run: pnpm --filter @my-personal-assistant/mobile exec expo config --type public

      - name: Bundle Android JavaScript
        run: pnpm --filter @my-personal-assistant/mobile exec expo export --platform android --output-dir /tmp/mobile-export-android

      - name: Bundle iOS JavaScript
        run: pnpm --filter @my-personal-assistant/mobile exec expo export --platform ios --output-dir /tmp/mobile-export-ios
