name: MYPA Global Monthly FPMA Reference

on:
  workflow_dispatch:
  schedule:
    - cron: '23 3 1 * *'

permissions:
  contents: read

concurrency:
  group: mypa-global-monthly-fpma
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-slim
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      FPMA_TIMEOUT_MS: '20000'
      FPMA_SERIES_PAGE_SIZE: '100'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - working-directory: apps/backend
        run: pnpm exec prisma migrate deploy
      - working-directory: apps/backend
        run: pnpm build
      - working-directory: apps/backend
        run: node ./dist/scripts/fao-fpma-monthly.js