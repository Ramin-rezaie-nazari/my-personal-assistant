name: MYPA content corpus bootstrap

on:
  push:
    branches:
      - agent/mypa-autonomous-control-plane
    paths:
      - 'apps/backend/scripts/fitness-content-import.mjs'
      - 'apps/backend/scripts/fitness-content-balance-levels.mjs'
      - 'apps/backend/scripts/fitness-content-audit.mjs'
      - 'apps/backend/scripts/fitness-media-verify.mjs'
      - 'apps/backend/scripts/fitness-media-download.mjs'
      - 'apps/backend/scripts/recipe-content-import.mjs'
      - 'apps/backend/scripts/recipe-content-audit.mjs'
      - 'apps/backend/scripts/recipe-media-download.mjs'
      - 'apps/backend/scripts/recipe-image-dataset-import-v2.mjs'
      - 'apps/backend/scripts/recipe-image-import-all-safe.mjs'
      - '.github/workflows/content-corpus-bootstrap.yml'
  workflow_dispatch:
    inputs:
      fitness_strict:
        description: 'Require four approved WebP assets for every selected movement'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: mypa-content-corpus-bootstrap
  cancel-in-progress: false

jobs:
  fitness:
    name: Fitness corpus
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      DATABASE_URL: ${{ secrets.MYPA_FITNESS_DATABASE_URL }}
      FITNESS_TARGET_PER_DISCIPLINE: '500'
      FITNESS_IMPORT_STRICT: ${{ github.event_name == 'workflow_dispatch' && inputs.fitness_strict == false && '0' || '1' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.18.0, run_install: false }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: test -n "$DATABASE_URL" || { echo 'MYPA_FITNESS_DATABASE_URL is required for the fitness corpus.'; exit 2; }
      - run: pnpm install --frozen-lockfile
      - working-directory: apps/backend
        run: pnpm prisma generate
      - working-directory: apps/backend
        run: pnpm fitness:content:import
      - working-directory: apps/backend
        run: pnpm fitness:content:balance-levels
      - working-directory: apps/backend
        run: pnpm fitness:content:audit

  fitness-images:
    name: Fitness image download and storage mirror
    needs: fitness
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      DATABASE_URL: ${{ secrets.MYPA_FITNESS_DATABASE_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      FITNESS_MEDIA_CONCURRENCY: '6'
      FITNESS_MEDIA_MAX_BYTES: '65536'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.18.0, run_install: false }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: |
          test -n "$DATABASE_URL" || { echo 'MYPA_FITNESS_DATABASE_URL is required for fitness media mirroring.'; exit 2; }
          test -n "$SUPABASE_URL" || { echo 'SUPABASE_URL is required for fitness media mirroring.'; exit 2; }
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo 'SUPABASE_SERVICE_ROLE_KEY is required for fitness media mirroring.'; exit 2; }
      - run: pnpm install --frozen-lockfile
      - working-directory: apps/backend
        run: pnpm prisma generate
      - working-directory: apps/backend
        run: node ./scripts/fitness-media-download.mjs
      - working-directory: apps/backend
        run: pnpm fitness:content:verify-media

  recipes:
    name: Recipe corpus
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      DATABASE_URL: ${{ secrets.MYPA_RECIPE_DATABASE_URL }}
      RECIPE_IMPORT_CONCURRENCY: '2'
      RECIPE_MAX_MEDIA: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.18.0, run_install: false }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: test -n "$DATABASE_URL" || { echo 'MYPA_RECIPE_DATABASE_URL is required for the recipe corpus.'; exit 2; }
      - run: pnpm install --frozen-lockfile
      - working-directory: apps/backend
        run: pnpm prisma generate
      - working-directory: apps/backend
        run: node ./scripts/recipe-content-import.mjs
      - working-directory: apps/backend
        run: pnpm recipe:content:audit

  recipe-images:
    name: Recipe real-image dataset mirror
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      RECIPE_IMAGE_CONCURRENCY: '4'
      RECIPE_IMAGE_RESET: '0'
      RECIPE_IMAGE_ALLOW_INCOMPLETE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.18.0, run_install: false }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: |
          test -n "$SUPABASE_URL" || { echo 'SUPABASE_URL is required for recipe media mirroring.'; exit 2; }
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo 'SUPABASE_SERVICE_ROLE_KEY is required for recipe media mirroring.'; exit 2; }
      - run: pnpm install --frozen-lockfile
      - working-directory: apps/backend
        run: node ./scripts/recipe-image-dataset-import-v2.mjs

  recipe-wikimedia-fallback:
    name: Recipe Wikimedia fallback
    needs: recipe-images
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      RECIPE_IMAGE_BATCH_SIZE: '25'
      RECIPE_IMAGE_MAX_PASSES: '20'
      WIKIMEDIA_DELAY_MS: '1000'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.18.0, run_install: false }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: |
          test -n "$SUPABASE_URL" || { echo 'SUPABASE_URL is required for recipe fallback.'; exit 2; }
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo 'SUPABASE_SERVICE_ROLE_KEY is required for recipe fallback.'; exit 2; }
      - run: pnpm install --frozen-lockfile
      - working-directory: apps/backend
        run: node ./scripts/recipe-image-import-all-safe.mjs
      - name: Assert exactly one hero per recipe and all hero media are WebP
        working-directory: apps/backend
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node --input-type=module <<'NODE'
          const base=process.env.SUPABASE_URL.replace(/\/+$/,''); const key=process.env.SUPABASE_SERVICE_ROLE_KEY; const headers={apikey:key,Authorization:`Bearer ${key}`};
          const fetchRows=async(table,q)=>{const r=await fetch(`${base}/rest/v1/${table}?${q}`,{headers});if(!r.ok)throw new Error(`${r.status} ${await r.text()}`);return r.json()};
          const count=async(table,q)=>{const r=await fetch(`${base}/rest/v1/${table}?select=id&${q}&limit=1`,{headers:{...headers,Prefer:'count=exact'}});if(!r.ok)throw new Error(`${r.status} ${await r.text()}`);return Number((r.headers.get('content-range')||'0/0').split('/')[1])};
          const recipes=await count('recipes','id=not.is.null'); const heroes=await fetchRows('recipe_images','select=recipe_id,mime_type,image_url,storage_key&image_type=eq.hero&order=recipe_id.asc&limit=20000'); const by=new Map(); for(const r of heroes)by.set(r.recipe_id,(by.get(r.recipe_id)||0)+1); const dup=[...by.values()].filter(n=>n!==1).length; const webp=heroes.filter(r=>r.mime_type==='image/webp'&&/\/hero\.webp$/.test(r.storage_key||'')&&/\/hero\.webp$/.test(r.image_url||'')).length; if(heroes.length!==recipes||dup!==0||webp!==recipes)throw new Error(JSON.stringify({recipes,heroRows:heroes.length,duplicateRecipeIds:dup,webp})); console.log(JSON.stringify({recipes,heroRows:heroes.length,duplicateRecipeIds:dup,webp},null,2));
          NODE
