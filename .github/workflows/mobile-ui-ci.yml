name: Mobile UI Quality

on:
  push:
    branches:
      - main
      - 'work/**'
  pull_request:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/mobile-ui-ci.yml'
  workflow_dispatch:

jobs:
  mobile-ui:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: UI quality contract
        run: pnpm --filter @my-personal-assistant/mobile ui:quality

      - name: Voice quality contract
        run: pnpm --filter @my-personal-assistant/mobile voice:quality

      - name: Mobile typecheck
        run: pnpm --filter @my-personal-assistant/mobile typecheck
