name: MYPA docs ledger sync

on:
  push:
    branches:
      - agent/mypa-autonomous-control-plane
    paths:
      - '.github/workflows/mypa-docs-ledger-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Repair mobile reminder RTL style typing
        shell: python
        run: |
          from pathlib import Path
          path = Path('apps/mobile/app/reminders-localized.tsx')
          text = path.read_text(encoding='utf-8')
          replacements = {
              'rtl&&styles.textRight': 'rtl ? styles.textRight : styles.textLeft',
              'rtl&&styles.inputRtl': 'rtl ? styles.inputRtl : styles.input',
              'rtl ? styles.rtl : undefined': 'rtl ? styles.rtl : styles.rtlCard',
              'undefinedCard': 'styles.rtlCard',
              '!showAll ? styles.filterActive : undefined': '!showAll ? styles.filterActive : styles.filter',
              'showAll ? styles.filterActive : undefined': 'showAll ? styles.filterActive : styles.filter',
              'item.completed ? styles.completedBadge : undefined': 'item.completed ? styles.completedBadge : styles.badge',
              'index===items.length-1 ? styles.lastRow : undefined': 'index===items.length-1 ? styles.lastRow : styles.reminderRow',
              'rtl?{paddingRight:0,paddingLeft:12}:null': 'rtl ? {paddingRight:0,paddingLeft:12} : styles.reminderCopy',
              'rtl ? styles.rtl : undefined': 'rtl ? styles.rtl : styles.rtlCard',
          }
          for old, new in replacements.items():
              text = text.replace(old, new)
          if 'textLeft:' not in text:
              text = text.replace('textRight:{textAlign:\'right\'},', 'textRight:{textAlign:\'right\'},textLeft:{textAlign:\'left\'},')
          path.write_text(text, encoding='utf-8')

      - name: Append completion ledger to A/B/C plus Brain Book
        shell: python
        run: |
          from pathlib import Path

          entries = {
              '03_PROJECT_BRAIN_BOOK.md': '''\n## 2026-09-06 — Smart Meals source-of-truth integration\n\nThe mobile Smart Meals journey now consumes the authenticated `POST /recommendation-intelligence/food` result instead of constructing a second local recommendation ranking. The Personal Brain remains responsible for nutrition constraints, inventory coverage, country context, recent-meal personalization, deterministic ranking and explanations; mobile is responsible for presentation and navigation to the selected recipe.\n\nThe mobile client keeps the backend result typed and navigates each recommendation to the existing recipe detail route. No local recommendation score is used for the displayed ranking.\n''',
              '04_ARCHITECTURE_ATLAS.md': '''\n## 2026-09-06 — Smart Meals source-of-truth integration\n\n- Added `apps/mobile/lib/recommendation-api.ts` as the mobile contract for authenticated Food Recommendation Intelligence.\n- `apps/mobile/app/smart-meals.tsx` now requests nutrition summary, inventory and Brain recommendations in parallel.\n- Recommendation cards display backend score, pantry coverage, missing-ingredient count, calories, protein and deterministic reasons.\n- Tapping a recommendation routes to the existing `/recipe/:id` presentation surface.\n- The previous mobile-only `meal-intelligence` ranking is no longer the source of displayed Smart Meals ranking.\n\nThis preserves a single recommendation authority and prevents algorithm drift between backend and mobile.\n''',
              '05_CURRENT_STATE.md': '''\n## 2026-09-06 — Smart Meals source-of-truth integration\n\n### Implemented\n- Added typed authenticated mobile Recommendation Intelligence API client.\n- Smart Meals now consumes backend Personal Brain recommendations instead of local score/ranking construction.\n- Recommendation UI shows authoritative backend rank/score, inventory coverage, missing ingredients, calories, protein and reasons.\n- Recommendation cards deep-link to the existing recipe detail route.\n\n### Validation truth\n- Implementation is committed but still subject to the active mobile/Android CI gates.\n- No green CI or physical-device claim is made from source review alone.\n''',
              '06_VALIDATION_LEDGER.md': '''\n## 2026-09-06 — Smart Meals source-of-truth integration\n\n### Implementation\n- Added `recommendation-api.ts` for authenticated Food Recommendation Intelligence.\n- Replaced mobile Smart Meals local ranking with backend Brain recommendations.\n- Preserved inventory attention UX and recipe detail navigation.\n\n### Verification state\n**PENDING CI/runtime validation.** The implementation is not marked green until the relevant mobile and backend gates complete.\n''',
              '08_AUTONOMOUS_PROGRESS_LOG.md': '''\n## 2026-09-06 — Smart Meals source-of-truth integration\n\n- Found a recommendation-drift risk: Smart Meals was locally constructing a simplified score while a canonical backend Recommendation Intelligence service already existed.\n- Added a typed mobile client to the authenticated Brain recommendation endpoint.\n- Changed Smart Meals presentation to use backend scores/reasons/coverage as its authoritative result.\n- Kept the recipe detail surface as the final navigation target.\n- CI/device verification remains pending and is not inferred from source inspection.\n''',
          }

          for filename, entry in entries.items():
              path = Path('apps/backend/docs') / filename if filename.startswith(('03_', '04_', '05_', '06_','08_')) else Path(filename)
              if filename == '08_AUTONOMOUS_PROGRESS_LOG.md':
                  path = Path('apps/backend/docs/08_AUTONOMOUS_PROGRESS_LOG.md')
              text = path.read_text(encoding='utf-8')
              stamp = entry.splitlines()[1]
              if stamp not in text:
                  path.write_text(text.rstrip() + entry, encoding='utf-8')

      - name: Repair importer license normalization
        shell: python
        run: |
          from pathlib import Path
          path = Path('apps/backend/scripts/fitness-content-import.mjs')
          text = path.read_text(encoding='utf-8')
          text = text.replace("  'cc by-sa',", "  'cc by sa',")
          path.write_text(text, encoding='utf-8')

      - name: Commit documentation and maintenance fixes
        run: |
          files="apps/backend/docs/03_PROJECT_BRAIN_BOOK.md apps/backend/docs/04_ARCHITECTURE_ATLAS.md apps/backend/docs/05_CURRENT_STATE.md apps/backend/docs/06_VALIDATION_LEDGER.md apps/backend/docs/08_AUTONOMOUS_PROGRESS_LOG.md docs/roadmap/C-visual-ux-roadmap.md apps/backend/scripts/fitness-content-import.mjs apps/mobile/app/reminders-localized.tsx"
          if git diff --quiet -- $files; then
            echo 'No ledger or maintenance changes required.'
            exit 0
          fi
          git config user.name 'MYPA Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add $files
          git commit -m '[skip ci] docs: record Smart Meals source-of-truth integration'
          git push origin HEAD:agent/mypa-autonomous-control-plane
