name: MYPA docs ledger sync

on:
  push:
    branches:
      - agent/mypa-autonomous-control-plane
    paths:
      - '.github/workflows/mypa-docs-ledger-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Append completion ledger to A/B/C
        shell: python
        run: |
          from pathlib import Path

          stamp = '2026-09-05 — Autonomous completion ledger'
          architecture = Path('apps/backend/docs/04_ARCHITECTURE_ATLAS.md')
          current = Path('apps/backend/docs/05_CURRENT_STATE.md')
          roadmap = Path('docs/roadmap/C-visual-ux-roadmap.md')

          a = architecture.read_text(encoding='utf-8')
          a_marker = f'## {stamp}'
          a_append = '''\n\n## 2026-09-05 — Autonomous completion ledger\n\nThis batch extended the atlas with the concrete fitness/content architecture now present in the repository.\n\n### Completed engineering work\n\n- Added persistent `FitnessExerciseCatalog`, `FitnessExerciseMedia`, and `FitnessDisciplineProgress` migration tables with explicit provenance, licensing, publishing state, parent/variant relationships, and media positions.\n- Changed `FitnessCatalogService` to read the persistent published catalog first, enforce difficulty ceilings, expose ten progression levels, pagination/search, and the four-approved-WebP release contract, while retaining a safe fallback catalog path.\n- Added authenticated fitness progression persistence and session recording with bounded level promotion rules.\n- Added mobile Gym / Calisthenics / Yoga catalog UX, ten-level selection, current-level recommendation, search/pagination, session completion, media completeness and attribution.\n- Added the fitness importer, audit gate, WebP media verifier and content policy. The importer deliberately does not check raw third-party datasets into the public repository.\n- Added regression coverage for fitness catalog behavior and recipe-library ownership-aware pagination behavior.\n- Repaired the mobile voice/TTS type contract, language routing, Expo speech/location dependency synchronization path, and legacy camera/reminder compatibility issues through a one-time dependency-sync workflow.\n\n### Architectural safety boundaries\n\n- Fitness content is persistent-first; fallback content is not treated as production-complete corpus evidence.\n- A movement is publishable only when its content record and four distinct approved WebP assets satisfy the release gate.\n- User fitness progression is isolated per authenticated user and discipline.\n- Third-party content licensing is represented as data and release policy rather than assumed.\n- Production database changes are never forced against an unverified schema.\n'''
          if a_marker not in a:
              architecture.write_text(a.rstrip() + a_append, encoding='utf-8')

          b = current.read_text(encoding='utf-8')
          b_marker = f'## {stamp}'
          b_append = '''\n\n## 2026-09-05 — Autonomous completion ledger\n\n### Completed in this batch\n\n- Persistent fitness catalog schema/migration created.\n- Fitness catalog API changed to persistent-first with a strict four-WebP media contract and ten levels.\n- Per-user progression/session persistence added and wired to the mobile session flow.\n- Gym, Calisthenics and Yoga mobile catalog flows expanded with levels, search, paging, progress and attribution.\n- Fitness importer/audit/media-verification tooling and licensing policy added.\n- Recipe/fitness unit-test regressions corrected without weakening assertions.\n- Mobile Expo/TTS/location/camera/reminder compatibility fixes staged through an automated lockfile synchronization workflow.\n\n### Validation truth\n\nThe branch has live CI runs after the latest mobile/TTS changes; green CI is only declared from completed GitHub Actions results. The currently connected Supabase project has not been accepted as the application's production database because its schema does not match the repository's `User`-based Prisma model. Therefore the required 1,500-movement / 6,000-WebP production corpus is **not** claimed populated yet.\n\n### Remaining release blockers\n\n- Resolve/verify the correct production PostgreSQL/Supabase target, then apply the fitness catalog migration.\n- Execute the real fitness corpus import and pass `fitness:content:audit` and `fitness:content:verify-media`.\n- Complete mobile CI/device validation, especially native voice/TTS behavior.\n- Continue broader production hardening and real-device QA.\n'''
          if b_marker not in b:
              current.write_text(b.rstrip() + b_append, encoding='utf-8')

          c = roadmap.read_text(encoding='utf-8')
          c_marker = f'## {stamp}'
          c_append = '''\n\n## 2026-09-05 — Temporary roadmap closure note\n\nThe previously planned visual/onboarding checkpoint has been implemented in code. This C document remains a temporary roadmap only; detailed implementation history now lives in A/B.\n\nCompleted alongside this checkpoint: persistent fitness catalog architecture, ten-level fitness UX, user progression/session persistence, recipe/fitness regression fixes, and mobile Expo/TTS compatibility repair.\n\nTemporary remaining verification: physical-device onboarding/voice review and the production fitness corpus population gate.\n'''
          if c_marker not in c:
              roadmap.write_text(c.rstrip() + c_append, encoding='utf-8')

      - name: Commit documentation
        run: |
          if git diff --quiet -- apps/backend/docs/04_ARCHITECTURE_ATLAS.md apps/backend/docs/05_CURRENT_STATE.md docs/roadmap/C-visual-ux-roadmap.md; then
            echo 'Ledger already present.'
            exit 0
          fi
          git config user.name 'MYPA Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add apps/backend/docs/04_ARCHITECTURE_ATLAS.md apps/backend/docs/05_CURRENT_STATE.md docs/roadmap/C-visual-ux-roadmap.md
          git commit -m '[skip ci] docs: record autonomous engineering ledger'
          git push origin HEAD:agent/mypa-autonomous-control-plane
