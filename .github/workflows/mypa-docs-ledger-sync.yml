name: MYPA docs ledger sync

on:
  push:
    branches:
      - agent/mypa-autonomous-control-plane
    paths:
      - '.github/workflows/mypa-docs-ledger-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Repair mobile reminder RTL style typing
        shell: python
        run: |
          from pathlib import Path
          path = Path('apps/mobile/app/reminders-localized.tsx')
          text = path.read_text(encoding='utf-8')
          replacements = {
              'rtl&&styles.textRight': 'rtl ? styles.textRight : styles.textLeft',
              'rtl&&styles.inputRtl': 'rtl ? styles.inputRtl : styles.input',
              'rtl ? styles.rtl : undefined': 'rtl ? styles.rtl : styles.rtlCard',
              'undefinedCard': 'styles.rtlCard',
              '!showAll ? styles.filterActive : undefined': '!showAll ? styles.filterActive : styles.filter',
              'showAll ? styles.filterActive : undefined': 'showAll ? styles.filterActive : styles.filter',
              'item.completed ? styles.completedBadge : undefined': 'item.completed ? styles.completedBadge : styles.badge',
              'index===items.length-1 ? styles.lastRow : undefined': 'index===items.length-1 ? styles.lastRow : styles.reminderRow',
              'rtl?{paddingRight:0,paddingLeft:12}:null': 'rtl ? {paddingRight:0,paddingLeft:12} : styles.reminderCopy',
              'rtl ? styles.rtl : undefined': 'rtl ? styles.rtl : styles.rtlCard',
          }
          for old, new in replacements.items():
              text = text.replace(old, new)
          if 'textLeft:' not in text:
              text = text.replace('textRight:{textAlign:\'right\'},', 'textRight:{textAlign:\'right\'},textLeft:{textAlign:\'left\'},')
          path.write_text(text, encoding='utf-8')

      - name: Append completion ledger to A/B/C
        shell: python
        run: |
          from pathlib import Path

          stamp = '## 2026-09-06 — Content experience expansion'
          architecture = Path('apps/backend/docs/04_ARCHITECTURE_ATLAS.md')
          current = Path('apps/backend/docs/05_CURRENT_STATE.md')
          roadmap = Path('docs/roadmap/C-visual-ux-roadmap.md')

          a = architecture.read_text(encoding='utf-8')
          if stamp not in a:
              architecture.write_text(a.rstrip() + '''\n\n## 2026-09-06 — Content experience expansion\n\n- Recipe presentation now has persisted step-by-step instructions and a persisted gallery-media model with explicit source/license/attribution fields.\n- Mobile recipe detail displays the recipe gallery, scaled ingredients, preparation steps and step media when available.\n- Fitness release gates now require 500 publishable movements per supported discipline, ten balanced difficulty levels, and four distinct approved WebP assets per movement.\n- Fitness session UX displays movement media while the user is actively following the session and records completion/progression.\n- A first-party Prisma-native recipe content importer was added for the open Wikibooks Cookbook dataset, with explicit CC BY-SA provenance and optional Wikimedia image enrichment.\n\nThe corpus is still considered incomplete until the local database population and audit gates pass.\n''', encoding='utf-8')

          b = current.read_text(encoding='utf-8')
          if stamp not in b:
              current.write_text(b.rstrip() + '''\n\n## 2026-09-06 — Content experience expansion\n\n### Implemented\n- Persisted `RecipeStep` and `RecipeMedia` models/migrations.\n- Authenticated complete recipe presentation endpoint.\n- Mobile recipe gallery + preparation-step UI + serving scaling.\n- Fitness session media and progression recording.\n- Deterministic fitness level balancer and strict 500-per-discipline / 10-level / 4-WebP audit gate.\n- Prisma-native recipe corpus importer with explicit provenance/licensing data.\n\n### Not yet claimed complete\n- The required full fitness corpus (1,500 movements / 6,000 approved WebP assets) has not been runtime-audited on the local database in this environment.\n- The full recipe corpus has not been runtime-imported/audited in this environment.\n- Physical iOS/Android visual and native runtime validation remains a separate release gate.\n''', encoding='utf-8')

          c = roadmap.read_text(encoding='utf-8')
          if stamp not in c:
              roadmap.write_text(c.rstrip() + '''\n\n## 2026-09-06 — Content experience expansion\n\nRecipe cooking presentation and fitness movement/session presentation are now implemented in code. Remaining work is corpus population/audit, physical-device QA and production hardening.\n''', encoding='utf-8')

      - name: Repair importer license normalization
        shell: python
        run: |
          from pathlib import Path
          path = Path('apps/backend/scripts/fitness-content-import.mjs')
          text = path.read_text(encoding='utf-8')
          text = text.replace("  'cc by-sa',", "  'cc by sa',")
          path.write_text(text, encoding='utf-8')

      - name: Commit documentation and maintenance fixes
        run: |
          files="apps/backend/docs/04_ARCHITECTURE_ATLAS.md apps/backend/docs/05_CURRENT_STATE.md docs/roadmap/C-visual-ux-roadmap.md apps/backend/scripts/fitness-content-import.mjs apps/mobile/app/reminders-localized.tsx"
          if git diff --quiet -- $files; then
            echo 'No ledger or maintenance changes required.'
            exit 0
          fi
          git config user.name 'MYPA Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add $files
          git commit -m '[skip ci] docs: record content experience expansion and mobile fixes'
          git push origin HEAD:agent/mypa-autonomous-control-plane
