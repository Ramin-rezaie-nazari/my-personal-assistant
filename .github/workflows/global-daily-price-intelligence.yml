name: Global Daily Price Intelligence

on:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'

permissions:
  contents: read

concurrency:
  group: global-price-intelligence
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PRICE_OPEN_PRICES_MAX_PAGES: '50'
      PRICE_OPEN_PRICES_PAGE_SIZE: '100'
      PRICE_OPEN_PRICES_SINCE_DAYS: '2'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply production price-intelligence migration
        working-directory: apps/backend
        run: pnpm exec prisma migrate deploy
      - name: Build backend
        working-directory: apps/backend
        run: pnpm build
      - name: Collect global price observations
        working-directory: apps/backend
        run: pnpm price-intelligence:global-daily