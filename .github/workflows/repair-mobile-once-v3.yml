name: repair-mobile-once-v3

on:
  push:
    branches:
      - fix/mobile-typescript-and-doctor

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix syntax
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('apps/mobile/app/index.tsx')
          text = path.read_text()
          marker = 'pressed:{opacity:.9}}'
          if not text.rstrip().endswith(marker):
              raise SystemExit('Unexpected app/index.tsx ending')
          path.write_text(text.rstrip() + ');\n')
          PY
      - name: Commit
        shell: bash
        run: |
          rm -f .github/workflows/repair-mobile-once.yml .github/workflows/repair-mobile-once-v2.yml .github/workflows/repair-mobile-once-v3.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/mobile/app/index.tsx .github/workflows
          git commit -m 'fix(mobile): close dashboard styles declaration'
          git push origin HEAD:fix/mobile-typescript-and-doctor
