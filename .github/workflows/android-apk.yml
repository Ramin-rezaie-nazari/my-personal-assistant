# Canonical post-merge native gate: pre-device validation only.
name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.npmrc'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

env:
  CI: '1'
  NODE_ENV: production

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Typecheck mobile
        run: pnpm typecheck

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install required Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Generate native Android project
        run: pnpm exec expo prebuild --platform android

      - name: Build standalone release APK
        run: ./gradlew assembleRelease --no-daemon
        working-directory: apps/mobile/android

      - name: Verify JavaScript bundle is packaged in APK
        run: |
          test "$(unzip -Z1 android/app/build/outputs/apk/release/app-release.apk | grep -Fx 'assets/index.android.bundle' | wc -l)" -eq 1
          echo "Verified assets/index.android.bundle is packaged in the standalone APK."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: my-personal-assistant-standalone-apk
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      # Keep this workflow path-bearing so final-verification commits can exercise native build evidence.
