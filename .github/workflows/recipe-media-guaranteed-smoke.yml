name: Recipe Media Real-Image Smoke

on:
  push:
    paths:
      - 'apps/backend/scripts/recipe-media-final-generated-v1.mjs'
      - 'apps/backend/package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/recipe-media-guaranteed-smoke.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prepare real-food fixture
        working-directory: apps/backend
        env:
          IMAGE_URL: https://commons.wikimedia.org/wiki/Special:Redirect/file/Cake!.jpg?width=640
        run: |
          mkdir -p .tmp-recipe-images
          curl -L --fail --retry 4 --retry-all-errors "$IMAGE_URL" -o .tmp-recipe-images/Cake.jpg
          file .tmp-recipe-images/Cake.jpg
      - name: Run real-image final-media generator
        working-directory: apps/backend
        env:
          RECIPE_FINAL_CONCURRENCY: 1
          RECIPE_IMAGE_DATASET_DIR: ${{ github.workspace }}/apps/backend/.tmp-recipe-images
          MYPA_CONTENT_MIRROR_ROOT: ${{ github.workspace }}/apps/backend/.tmp-content-mirror
          RECIPE_DATASET_URL: data:application/json,%5B%7B%22title%22%3A%22Cake%22%2C%22image_name%22%3A%22Cake.jpg%22%2C%22url%22%3A%22https%3A%2F%2Fcommons.wikimedia.org%2Fwiki%2FFile%3ACake%2521.jpg%22%7D%5D
        run: node ./scripts/recipe-media-final-generated-v1.mjs
      - name: Verify one-real-image contract
        working-directory: apps/backend
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const root = path.resolve('.tmp-content-mirror');
          const s = JSON.parse(fs.readFileSync(path.join(root,'recipe-final-summary.json'),'utf8'));
          if (!s.corpusComplete || s.recipes !== 1 || s.complete !== 1 || s.failed !== 0 || s.generatedImages !== 0) throw new Error(JSON.stringify(s));
          const m = JSON.parse(fs.readFileSync(path.join(root,'recipe-final-manifest.json'),'utf8'));
          const x = Object.values(m.items)[0];
          if (!x || x.mediaCount !== 1 || x.stage !== 'final' || x.generated !== false || x.sourceType !== 'real-dataset-image' || x.format !== 'webp' || x.sizeBytes <= 0 || x.sizeBytes > 65536) throw new Error('real-image contract failed');
          if (!fs.existsSync(path.join(root,x.localPath))) throw new Error('media file missing');
          console.log(JSON.stringify({summary:s,item:x},null,2));
          NODE
