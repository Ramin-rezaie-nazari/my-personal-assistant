name: Recipe Media Guaranteed Smoke

on:
  push:
    paths:
      - 'apps/backend/scripts/recipe-media-guaranteed-mirror-v6.mjs'
      - 'apps/backend/package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/recipe-media-guaranteed-smoke.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run guaranteed media smoke test
        working-directory: apps/backend
        env:
          RECIPE_STAGE_CONCURRENCY: 1
          MYPA_CONTENT_MIRROR_ROOT: ${{ github.workspace }}/.tmp-content-mirror
          RECIPE_DATASET_URL: data:application/json,%5B%7B%22title%22%3A%221-2-3-4%20Cake%22%2C%22url%22%3A%22https%3A%2F%2Fen.wikibooks.org%2Fwiki%2FCookbook%3A1-2-3-4_Cake%22%2C%22text_lines%22%3A%5B%7B%22line_type%22%3A%22ul%22%2C%22section%22%3A%22Ingredients%22%2C%22text%22%3A%22flour%22%7D%2C%7B%22line_type%22%3A%22ul%22%2C%22section%22%3A%22Ingredients%22%2C%22text%22%3A%22sugar%22%7D%2C%7B%22line_type%22%3A%22ol%22%2C%22section%22%3A%22Method%22%2C%22text%22%3A%22Mix the flour and sugar.%22%7D%2C%7B%22line_type%22%3A%22ol%22%2C%22section%22%3A%22Method%22%2C%22text%22%3A%22Bake the cake.%22%7D%2C%7B%22line_type%22%3A%22ol%22%2C%22section%22%3A%22Method%22%2C%22text%22%3A%22Cool and decorate the cake.%22%7D%5D%7D%2C%7B%22title%22%3A%2220-Ingredient%20Brownies%22%2C%22url%22%3A%22https%3A%2F%2Fen.wikibooks.org%2Fwiki%2FCookbook%3A20-Ingredient_Brownies%22%2C%22text_lines%22%3A%5B%7B%22line_type%22%3A%22ul%22%2C%22section%22%3A%22Ingredients%22%2C%22text%22%3A%22chocolate%22%7D%2C%7B%22line_type%22%3A%22ul%22%2C%22section%22%3A%22Ingredients%22%2C%22text%22%3A%22butter%22%7D%2C%7B%22line_type%22%3A%22ol%22%2C%22section%22%3A%22Procedure%22%2C%22text%22%3A%22Melt the chocolate and butter.%22%7D%2C%7B%22line_type%22%3A%22ol%22%2C%22section%22%3A%22Procedure%22%2C%22text%22%3A%22Bake the mixture and cool it.%22%7D%5D%7D%2C%7B%22title%22%3A%22Tomato%20Salad%22%2C%22url%22%3A%22https%3A%2F%2Fen.wikibooks.org%2Fwiki%2FCookbook%3ATomato_Salad%22%2C%22text_lines%22%3A%5B%7B%22line_type%22%3A%22ul%22%2C%22section%22%3A%22Ingredients%22%2C%22text%22%3A%22tomato%22%7D%2C%7B%22line_type%22%3A%22ul%22%2C%22section%22%3A%22Ingredients%22%2C%22text%22%3A%22olive%20oil%22%7D%2C%7B%22line_type%22%3A%22ol%22%2C%22section%22%3A%22Instructions%22%2C%22text%22%3A%22Chop%20the%20tomato%20and%20dress%20with%20olive%20oil.%22%7D%5D%7D%2C%7B%22title%22%3A%22Pantry%20Snack%22%2C%22url%22%3A%22https%3A%2F%2Fen.wikibooks.org%2Fwiki%2FCookbook%3APantry_Snack%22%2C%22text_lines%22%3A%5B%7B%22line_type%22%3A%22ul%22%2C%22section%22%3A%22Ingredients%22%2C%22text%22%3A%22oats%22%7D%2C%7B%22line_type%22%3A%22ul%22%2C%22section%22%3A%22Ingredients%22%2C%22text%22%3A%22nuts%22%7D%5D%7D%5D
          run: node ./scripts/recipe-media-guaranteed-mirror-v6.mjs
      - name: Verify four-stage contract and provenance
        working-directory: apps/backend
        run: node -e "const fs=require('fs'),path=require('path');const root='.tmp-content-mirror';const s=JSON.parse(fs.readFileSync(path.join(root,'recipe-stage-summary.json')));if(s.recipes!==4||s.complete!==4)throw Error(JSON.stringify(s));const m=JSON.parse(fs.readFileSync(path.join(root,'manifest.json'))),r=Object.values(m.items);for(const x of r){if(x.mediaCount!==4||x.media.length!==4||x.stageStatus!=='complete')throw Error('contract '+x.name);if(x.media.map(v=>v.stage).sort().join(',')!=='final,process-1,process-2,process-3')throw Error('stages '+x.name);const p=x.media.filter(v=>v.stage.startsWith('process-'));if(p.length!==3||!p.every(v=>v.evidence&&v.stageSourceType))throw Error('provenance '+x.name);if(new Set(p.map(v=>v.sha256)).size!==3)throw Error('duplicate process media '+x.name);for(const v of x.media){const f=path.join(root,v.localPath);if(v.status!=='ready'||v.format!=='webp'||v.sizeBytes<=0||v.sizeBytes>65536||!fs.existsSync(f))throw Error('media '+x.name+'/'+v.stage)}}const one=r.find(x=>x.name==='Tomato Salad');if(one.processCoverage.derivedStages!==2||one.processCoverage.explicitStepStages!==1)throw Error('one-step plan');const zero=r.find(x=>x.name==='Pantry Snack');if(zero.processCoverage.derivedStages!==3)throw Error('zero-step plan');console.log(JSON.stringify(s,null,2));"