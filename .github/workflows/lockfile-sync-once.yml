name: MYPA lockfile sync once

on:
  push:
    branches:
      - agent/mypa-autonomous-control-plane
    paths:
      - 'apps/backend/package.json'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Regenerate lockfile from package manifests
        run: pnpm install --lockfile-only
      - name: Commit synchronized lockfile
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo 'LOCKFILE_ALREADY_ALIGNED=1'
            exit 0
          fi
          git config user.name 'MYPA Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add pnpm-lock.yaml
          git commit -m 'chore(ci): synchronize pnpm lockfile [skip ci]'
          git push
