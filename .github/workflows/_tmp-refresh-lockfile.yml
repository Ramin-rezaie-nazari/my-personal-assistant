name: _tmp Refresh Lockfile

on:
  push:
    branches: [audit/project-brain-2026-09-11]
    paths:
      - '.github/workflows/_tmp-refresh-lockfile.yml'
      - 'apps/backend/package.json'
      - 'apps/mobile/package.json'
      - 'pnpm-lock.yaml'

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - name: Upload lockfile
        uses: actions/upload-artifact@v4
        with:
          name: refreshed-pnpm-lock
          path: pnpm-lock.yaml
