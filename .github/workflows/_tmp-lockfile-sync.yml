name: MYPA temporary lockfile sync

on:
  push:
    branches:
      - audit/project-brain-2026-09-11

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sync branch and regenerate lockfile
        shell: bash
        run: |
          git fetch origin "$GITHUB_REF_NAME"
          git reset --hard "origin/$GITHUB_REF_NAME"
          pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commit lockfile and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/_tmp-lockfile-sync.yml
          git add pnpm-lock.yaml .github/workflows/_tmp-lockfile-sync.yml
          if git diff --cached --quiet; then
            echo "No lockfile changes detected."
            exit 0
          fi
          git commit -m "chore: sync pnpm lockfile with workspace manifests"
          git push origin HEAD:${GITHUB_REF_NAME}
