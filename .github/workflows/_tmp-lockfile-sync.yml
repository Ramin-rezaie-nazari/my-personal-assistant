name: MYPA temporary lockfile verification

on:
  push:
    branches:
      - audit/project-brain-2026-09-11

permissions:
  contents: read

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate lockfile metadata
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Upload generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: mypa-pnpm-lock
          path: pnpm-lock.yaml
          if-no-files-found: error
