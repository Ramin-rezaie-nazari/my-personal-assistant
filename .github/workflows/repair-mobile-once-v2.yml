name: repair-mobile-once-v2

on:
  push:
    branches:
      - fix/mobile-typescript-and-doctor

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Repair and validate
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('apps/mobile/app/index.tsx')
          text = path.read_text()
          if not text.rstrip().endswith('pressed:{opacity:.9}}'):
              raise SystemExit('Unexpected app/index.tsx ending')
          path.write_text(text.rstrip() + ');\n')
          PY
          pnpm install --lockfile-only
          pnpm --filter @my-personal-assistant/mobile typecheck
          cd apps/mobile
          pnpm exec expo config --json --full > /tmp/expo-config.json
          cd ../..
      - name: Commit repair
        shell: bash
        run: |
          rm -f .github/workflows/repair-mobile-once.yml .github/workflows/repair-mobile-once-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/mobile/app/index.tsx pnpm-lock.yaml .github/workflows/repair-mobile-once.yml .github/workflows/repair-mobile-once-v2.yml
          git commit -m 'fix(mobile): repair JSX syntax and lockfile'
          git push origin HEAD:fix/mobile-typescript-and-doctor
