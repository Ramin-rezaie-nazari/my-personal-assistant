name: Recipe image import

on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'Recipes to process in this manual run (0 = all unresolved)'
        required: false
        default: '100'
      concurrency:
        description: 'Concurrent Google image workers'
        required: false
        default: '2'
  schedule:
    - cron: '*/15 * * * *'
  push:
    branches:
      - main
      - agent/mypa-autonomous-control-plane
    paths:
      - 'apps/backend/scripts/recipe-image-google-first-result-import.mjs'
      - 'apps/backend/scripts/recipe-image-import-all-safe.mjs'
      - 'apps/backend/package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/recipe-image-import.yml'

concurrency:
  group: recipe-image-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read

    defaults:
      run:
        working-directory: apps/backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Import unresolved recipe heroes — Google first result
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RECIPE_GOOGLE_LIMIT: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.batch_size || '0' }}
          RECIPE_GOOGLE_CONCURRENCY: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.concurrency || '2' }}
          RECIPE_GOOGLE_DELAY_MS: '2500'
        run: node scripts/recipe-image-google-first-result-import.mjs

      - name: Fallback unresolved heroes — licensed Wikimedia pipeline
        if: failure()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RECIPE_IMAGE_BATCH_SIZE: '100'
          RECIPE_IMAGE_MAX_PASSES: '200'
          WIKIMEDIA_DELAY_MS: '1500'
        run: node scripts/recipe-image-import-all-safe.mjs
