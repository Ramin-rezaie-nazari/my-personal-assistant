name: MYPA recipe Google Images hero backfill

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Maximum number of missing recipe heroes to process (0 = all)'
        required: false
        default: '0'
        type: string
      delay_ms:
        description: 'Delay between per-recipe Google searches in milliseconds'
        required: false
        default: '2500'
        type: string
      concurrency:
        description: 'Parallel Google searches (1-3)'
        required: false
        default: '2'
        type: string
      dry_run:
        description: 'Search and report only; do not upload or write recipe_images'
        required: false
        default: false
        type: boolean
      force:
        description: 'Replace existing hero rows too (normally only missing heroes are processed)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: mypa-recipe-google-images-backfill-manual
  cancel-in-progress: false

env:
  RECIPE_GOOGLE_LIMIT: ${{ inputs.limit || '0' }}
  RECIPE_GOOGLE_DELAY_MS: ${{ inputs.delay_ms || '2500' }}
  RECIPE_GOOGLE_CONCURRENCY: ${{ inputs.concurrency || '2' }}
  RECIPE_GOOGLE_DRY_RUN: ${{ inputs.dry_run == true && '1' || '0' }}
  RECIPE_GOOGLE_FORCE: ${{ inputs.force == true && '1' || '0' }}

jobs:
  google-first-result:
    name: Manual Google Images first-result backfill
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Validate secrets
        run: |
          test -n "$SUPABASE_URL" || { echo 'SUPABASE_URL is required.'; exit 2; }
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo 'SUPABASE_SERVICE_ROLE_KEY is required.'; exit 2; }
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Syntax check importer
        working-directory: apps/backend
        run: node --check ./scripts/recipe-image-google-first-result-import.mjs
      - name: Run Google Images first-result backfill
        working-directory: apps/backend
        run: pnpm recipe-images:google-first
      - name: Audit hero coverage
        if: ${{ env.RECIPE_GOOGLE_DRY_RUN != '1' }}
        working-directory: apps/backend
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node --input-type=module <<'NODE'
          const base=process.env.SUPABASE_URL.replace(/\/+$/,'');
          const key=process.env.SUPABASE_SERVICE_ROLE_KEY;
          const headers={apikey:key,Authorization:`Bearer ${key}`};
          const count=async(table,q)=>{const r=await fetch(`${base}/rest/v1/${table}?select=id&${q}&limit=1`,{headers:{...headers,Prefer:'count=exact'}});if(!r.ok)throw new Error(`${r.status} ${await r.text()}`);return Number((r.headers.get('content-range')||'0/0').split('/')[1])};
          const recipes=await count('recipes','id=not.is.null');
          const heroes=await count('recipe_images','image_type=eq.hero');
          const missing=recipes-heroes;
          console.log(JSON.stringify({recipes,heroes,missing},null,2));
          if(missing!==0) process.exitCode=1;
          NODE
