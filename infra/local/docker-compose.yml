services:
  postgres:
    image: postgres:16-alpine
    container_name: mypa-postgres-local
    restart: unless-stopped
    environment:
      POSTGRES_DB: mypa
      POSTGRES_USER: mypa
      POSTGRES_PASSWORD: mypa-local-only
    ports:
      - "5432:5432"
    volumes:
      - mypa-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mypa -d mypa"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mypa-postgres-data:
