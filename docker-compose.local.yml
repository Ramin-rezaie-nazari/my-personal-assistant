services:
  postgres:
    image: postgres:17
    container_name: mypa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: my_personal_assistant
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - mypa_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d my_personal_assistant"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mypa_postgres_data:
